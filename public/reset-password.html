<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | ZYZU'S — Tutors & Libraries</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="auth-nav">
    <a href="/" class="brand-logo">
      <div class="brand-badge"><i class="fas fa-graduation-cap"></i></div>
      <span>ZYZU'S</span>
    </a>
    <nav class="nav-links">
      <a href="/login" class="nav-link btn-outline">Sign In</a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card-accent-bar"></div>

      <div class="card-header">
        <h2 class="card-title">Set New Password</h2>
        <p class="card-subtitle">Enter the 6-digit recovery code and choose a new secure password</p>
      </div>

      <div id="alert-box" class="alert-box alert-danger" style="display: none;">
        <i class="fas fa-exclamation-circle"></i>
        <div id="alert-text"></div>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="identifier">Email or Mobile Number</label>
          <div class="input-wrapper">
            <i class="fas fa-user-circle input-icon"></i>
            <input type="text" id="identifier" name="identifier" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset_code">6-Digit Recovery Code</label>
          <div class="input-wrapper">
            <i class="fas fa-shield-alt input-icon"></i>
            <input type="text" id="reset_code" name="reset_code" class="form-input" placeholder="e.g. 123456" maxlength="6" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Min 8 chars, mixed case & numbers" required>
            <button type="button" class="password-toggle" aria-label="Toggle password"><i class="fas fa-eye"></i></button>
          </div>
          <div class="password-meter"><div id="pwd-meter-bar" class="meter-bar"></div></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-check-double input-icon"></i>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat new password" required>
            <button type="button" class="password-toggle" aria-label="Toggle password"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" id="btn-submit" class="btn-primary">
            <div class="spinner"></div>
            <span class="btn-text">Reset Password & Login</span>
            <i class="fas fa-check-circle"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupPasswordMeter('new_password', 'pwd-meter-bar');

      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('identifier');
      const savedId = sessionStorage.getItem('resetIdentifier');
      const devOtp = sessionStorage.getItem('devOtp');

      const idInput = document.getElementById('identifier');
      if (urlId) idInput.value = urlId;
      else if (savedId) idInput.value = savedId;

      if (devOtp) {
        document.getElementById('reset_code').value = devOtp;
        showToast(`[Dev Mode] Auto-filled Code: ${devOtp}`, 'info', 5000);
      }

      const form = document.getElementById('reset-form');
      const btnSubmit = document.getElementById('btn-submit');
      const alertBox = document.getElementById('alert-box');
      const alertText = document.getElementById('alert-text');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = idInput.value.trim();
        const reset_code = document.getElementById('reset_code').value.trim();
        const new_password = document.getElementById('new_password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (new_password !== confirm_password) {
          alertText.textContent = 'Passwords do not match.';
          alertBox.style.display = 'flex';
          return;
        }

        btnSubmit.classList.add('loading');
        btnSubmit.disabled = true;

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, reset_code, new_password, confirm_password })
          });
          const data = await res.json();
          btnSubmit.classList.remove('loading');
          btnSubmit.disabled = false;

          if (data.success) {
            showToast('Password reset successfully! Redirecting to login...', 'success');
            sessionStorage.removeItem('resetIdentifier');
            sessionStorage.removeItem('devOtp');
            setTimeout(() => {
              window.location.href = '/login';
            }, 1000);
          } else {
            alertText.textContent = data.message || 'Failed to reset password.';
            alertBox.style.display = 'flex';
          }
        } catch (err) {
          btnSubmit.classList.remove('loading');
          btnSubmit.disabled = false;
          alertText.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'flex';
        }
      });
    });
  </script>
</body>
</html>
