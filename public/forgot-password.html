<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | ZYZU'S — Tutors & Libraries</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="auth-nav">
    <a href="/" class="brand-logo">
      <div class="brand-badge"><i class="fas fa-graduation-cap"></i></div>
      <span>ZYZU'S</span>
    </a>
    <nav class="nav-links">
      <a href="/login" class="nav-link btn-outline">Back to Login</a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card-accent-bar"></div>

      <div class="card-header">
        <h2 class="card-title">Reset Password</h2>
        <p class="card-subtitle">Enter your registered email or 10-digit mobile number to receive a secure recovery code</p>
      </div>

      <div id="alert-box" class="alert-box alert-danger" style="display: none;">
        <i class="fas fa-info-circle"></i>
        <div id="alert-text"></div>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="identifier">Email or 10-Digit Mobile</label>
          <div class="input-wrapper">
            <i class="fas fa-user-circle input-icon"></i>
            <input type="text" id="identifier" name="identifier" class="form-input" placeholder="e.g. rahul@example.com or 9876543210" required>
          </div>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" id="btn-submit" class="btn-primary">
            <div class="spinner"></div>
            <span class="btn-text">Send Recovery Code</span>
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
        Remembered your password? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/auth-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const btnSubmit = document.getElementById('btn-submit');
      const alertBox = document.getElementById('alert-box');
      const alertText = document.getElementById('alert-text');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('identifier').value.trim();
        if (!identifier) {
          alertText.textContent = 'Please enter your email or mobile number.';
          alertBox.style.display = 'flex';
          return;
        }

        btnSubmit.classList.add('loading');
        btnSubmit.disabled = true;

        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier })
          });
          const data = await res.json();
          btnSubmit.classList.remove('loading');
          btnSubmit.disabled = false;

          if (data.success) {
            showToast('Recovery code dispatched! Redirecting...', 'success');
            sessionStorage.setItem('resetIdentifier', identifier);
            if (data.devOtp) {
              sessionStorage.setItem('devOtp', data.devOtp);
            }
            setTimeout(() => {
              window.location.href = `/reset-password?identifier=${encodeURIComponent(identifier)}`;
            }, 1000);
          } else {
            alertText.textContent = data.message || 'Failed to send recovery code.';
            alertBox.style.display = 'flex';
          }
        } catch (err) {
          btnSubmit.classList.remove('loading');
          btnSubmit.disabled = false;
          alertText.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'flex';
        }
      });
    });
  </script>
</body>
</html>
