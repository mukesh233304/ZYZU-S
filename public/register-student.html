<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | ZYZU'S — Tutors & Libraries</title>
  <meta name="description" content="Register as a Student on ZYZU'S Home Tutor & Study Space Booking Platform">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Navigation -->
  <header class="auth-nav">
    <a href="/" class="brand-logo">
      <div class="brand-badge"><i class="fas fa-graduation-cap"></i></div>
      <span>ZYZU'S</span>
    </a>
    <nav class="nav-links">
      <a href="/login" class="nav-link btn-outline">Already registered? Sign In</a>
    </nav>
  </header>

  <!-- Container -->
  <div class="auth-container">
    <div class="auth-card wide">
      <div class="card-accent-bar"></div>

      <!-- Role Tabs -->
      <div class="role-tabs">
        <a href="/register/student" class="role-tab active">
          <i class="fas fa-user-graduate"></i> Student
        </a>
        <a href="/register/teacher" class="role-tab">
          <i class="fas fa-chalkboard-teacher"></i> Teacher
        </a>
        <a href="/register/library-owner" class="role-tab">
          <i class="fas fa-book-reader"></i> Library Owner
        </a>
      </div>

      <div class="card-header">
        <h2 class="card-title">Student Registration</h2>
        <p class="card-subtitle">Create your learner account to access verified home tutors & study spaces</p>
      </div>

      <!-- Alert for general errors -->
      <div id="reg-alert" class="alert-box alert-danger" style="display: none;">
        <i class="fas fa-exclamation-circle"></i>
        <div id="reg-alert-text"></div>
      </div>

      <form id="student-form" novalidate>
        <div class="form-grid">
          
          <!-- Full Name -->
          <div class="form-group col-span-2">
            <label class="form-label" for="full_name">Full Name *</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="full_name" name="full_name" class="form-input" placeholder="e.g. Rahul Sharma" required>
            </div>
            <span class="field-error" id="err-full_name"></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" name="email" class="form-input" placeholder="e.g. rahul@example.com" required>
            </div>
            <span class="field-error" id="err-email"></span>
          </div>

          <!-- Mobile -->
          <div class="form-group">
            <label class="form-label" for="mobile">10-Digit Mobile Number *</label>
            <div class="input-wrapper">
              <i class="fas fa-phone input-icon"></i>
              <input type="tel" id="mobile" name="mobile" class="form-input" placeholder="e.g. 9876543210" maxlength="10" required>
            </div>
            <span class="field-error" id="err-mobile"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" name="password" class="form-input" placeholder="Min 8 chars, mixed case & numbers" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
            <div class="password-meter"><div id="pwd-meter-bar" class="meter-bar"></div></div>
            <span class="field-error" id="err-password"></span>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password *</label>
            <div class="input-wrapper">
              <i class="fas fa-check-double input-icon"></i>
              <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat your password" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
            <span class="field-error" id="err-confirm_password"></span>
          </div>

          <!-- Date of Birth -->
          <div class="form-group">
            <label class="form-label" for="dob">Date of Birth *</label>
            <div class="input-wrapper">
              <i class="fas fa-calendar input-icon"></i>
              <input type="date" id="dob" name="dob" class="form-input" required>
            </div>
            <span class="field-error" id="err-dob"></span>
          </div>

          <!-- Gender -->
          <div class="form-group">
            <label class="form-label" for="gender">Gender *</label>
            <select id="gender" name="gender" class="form-select" required>
              <option value="">-- Select Gender --</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <span class="field-error" id="err-gender"></span>
          </div>

          <!-- District -->
          <div class="form-group">
            <label class="form-label" for="district_id">District *</label>
            <select id="district_id" name="district_id" class="form-select" required>
              <option value="">Loading districts...</option>
            </select>
            <span class="field-error" id="err-district_id"></span>
          </div>

          <!-- City / Area -->
          <div class="form-group">
            <label class="form-label" for="city_area">City / Area *</label>
            <div class="input-wrapper">
              <i class="fas fa-map-marker-alt input-icon"></i>
              <input type="text" id="city_area" name="city_area" class="form-input" placeholder="e.g. Saidpur Market / Sadar" required>
            </div>
            <span class="field-error" id="err-city_area"></span>
          </div>

          <!-- Address -->
          <div class="form-group col-span-2">
            <label class="form-label" for="address">Complete Address *</label>
            <textarea id="address" name="address" rows="2" class="form-textarea" placeholder="House/Flat No., Street, Landmark" required></textarea>
            <span class="field-error" id="err-address"></span>
          </div>

          <!-- Pincode -->
          <div class="form-group">
            <label class="form-label" for="pincode">6-Digit Pincode *</label>
            <div class="input-wrapper">
              <i class="fas fa-mail-bulk input-icon"></i>
              <input type="text" id="pincode" name="pincode" class="form-input" placeholder="e.g. 233304" maxlength="6" required>
            </div>
            <span class="field-error" id="err-pincode"></span>
          </div>

        </div>

        <!-- Submit Button -->
        <div style="margin-top: 1.5rem;">
          <button type="submit" id="btn-submit" class="btn-primary">
            <div class="spinner"></div>
            <span class="btn-text">Create Student Account</span>
            <i class="fas fa-user-check"></i>
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/auth-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadDistricts('district_id');
      setupPasswordMeter('password', 'pwd-meter-bar');

      const form = document.getElementById('student-form');
      const btnSubmit = document.getElementById('btn-submit');
      const alertBox = document.getElementById('reg-alert');
      const alertText = document.getElementById('reg-alert-text');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        // Quick client check
        if (payload.password !== payload.confirm_password) {
          showFieldError('confirm_password', 'Passwords do not match');
          return;
        }

        btnSubmit.classList.add('loading');
        btnSubmit.disabled = true;

        try {
          const res = await fetch('/api/auth/register/student', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          btnSubmit.classList.remove('loading');
          btnSubmit.disabled = false;

          if (res.status === 201 && data.success) {
            showToast('Student registered successfully! Redirecting...', 'success');
            if (data.token) localStorage.setItem('fp_token', data.token);
            if (data.user) localStorage.setItem('fp_user', JSON.stringify(data.user));
            setTimeout(() => {
              window.location.href = data.redirectUrl || '/dashboard/student';
            }, 600);
          } else if (res.status === 409 && data.field) {
            // Duplicate mobile / email
            showFieldError(data.field, data.message);
            showGeneralError(data.message);
          } else if (data.errors) {
            for (const [fName, fMsg] of Object.entries(data.errors)) {
              showFieldError(fName, fMsg);
            }
            showGeneralError('Please correct the highlighted errors.');
          } else {
            showGeneralError(data.message || 'Registration failed.');
          }
        } catch (err) {
          btnSubmit.classList.remove('loading');
          btnSubmit.disabled = false;
          showGeneralError('Network error. Please try again.');
        }
      });

      function clearErrors() {
        document.querySelectorAll('.field-error').forEach(el => {
          el.textContent = '';
          el.style.display = 'none';
        });
        document.querySelectorAll('.form-input, .form-select, .form-textarea').forEach(el => {
          el.classList.remove('is-invalid');
        });
        alertBox.style.display = 'none';
      }

      function showFieldError(fieldName, msg) {
        const errEl = document.getElementById(`err-${fieldName}`);
        const inputEl = document.getElementById(fieldName);
        if (errEl) {
          errEl.textContent = msg;
          errEl.style.display = 'block';
        }
        if (inputEl) {
          inputEl.classList.add('is-invalid');
        }
      }

      function showGeneralError(msg) {
        alertText.textContent = msg;
        alertBox.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
